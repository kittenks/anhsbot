// anhsbot 机器人名字池 + 技能等级配置文件
// Bot name pool + skill level config for anhsbot.
// 每行一个机器人：<名字> <技能等级(0=低 1=普通 2=高 3=精英)>
// One bot per line: <name> <skill (0=low 1=normal 2=high 3=elite)>
// 名字不要含空格（用下划线代替）。插件按此池轮询取名并赋予对应技能。
// Names must not contain spaces (use underscores). The plugin cycles the pool
// for names and assigns the matching skill.
// 实际同时在线的机器人数量受服务器 maxplayers 限制（默认 8，即最多 7 个 bot + 1 个玩家位）。
// The number of online bots is limited by the server maxplayers (default 8,
// i.e. up to 7 bots + 1 player slot).

