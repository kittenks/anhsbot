// =============================================================
//  anhsbot — A Nights Haunting Source 机器人插件 配置文件
//  anhsbot — Configuration file for the ANHS bot plugin
//
//  本文件由 SourceMod 首次加载 anhsbot.smx 时自动执行（AutoExecConfig）。
//  This file is auto-executed by SourceMod when anhsbot.smx first loads.
//  已存在则不会被覆盖；修改后 rcon 执行 `sm_cvar anhsbot_<name> <value>` 热改，
//  或重启服务器生效。
//  If this file already exists it will NOT be overwritten; apply changes live
//  with `sm_cvar anhsbot_<name> <value>` via rcon, or restart the server.
//
//  路径 / Path:  <游戏目录>/cfg/sourcemod/plugin.anhsbot.cfg
// =============================================================

// ---- 基础 / Basics ----

// 总开关 / Master switch. 0=停用插件（bot 不生成/不驱动），1=启用。
anhsbot_enable "1"

// 目标在线 bot 数量（旧方式）/ Target bot count (legacy).
// 0=不自动补齐；>0 时 autofill 维持该数量。推荐改用 anhsbot_quota。
// 0 = no autofill; >0 = autofill maintains this count. Prefer anhsbot_quota.
anhsbot_count "0"

// bot 名字前缀 / Name prefix for spawned bots (自动加两位序号 / auto 2-digit suffix).
// 注意：安装了 addons/sourcemod/configs/anhsbot_bots.cfg 时改用其中的名字池。
// Note: with addons/sourcemod/configs/anhsbot_bots.cfg installed, the name pool
// from that file is used instead.
anhsbot_name_prefix ""

// 自动补齐到目标数量 / Auto-maintain the target bot count.
anhsbot_autofill "1"

// 自动补齐检查间隔（秒）/ Seconds between autofill checks.
anhsbot_fill_interval "3.0"

// 默认技能等级 / Default bot skill: 0=低 1=普通 2=高 3=精英.
anhsbot_skill "2"

// 看门狗：每帧重设 FL_FAKECLIENT 标志 / Watchdog: re-assert FL_FAKECLIENT every frame.
// （ANHS 的 fake client 必须带 0x200 标志 OnPlayerRunCmd 才会每 tick 触发，详见说明文档）
// (ANHS fake clients need the 0x200 flag or OnPlayerRunCmd never fires.)
anhsbot_manage_flags "1"

// 死亡后多久（秒）看门狗主动重建该 bot / Seconds a dead bot waits before rebuild.
// （HL2MP 死亡玩家无法用命令原地复活，插件用原生 CreateFakeClient 重建并结转统计）
// (HL2MP cannot revive dead players by command; the plugin rebuilds via
//  CreateFakeClient and carries over K/D/damage stats.)
anhsbot_respawn_delay "6.0"

// 调试日志（1=详细日志到控制台）/ Verbose debug logging to server console.
anhsbot_debug "0"

// ---- 配额 / Quota ----

// bot 配额 / Total bot quota kept online.
// >0 时覆盖 anhsbot_count：不足自动加、超出自动踢。ANHS 硬上限 16 玩家，
// 即最多约 15 bot + 1 人类。
// >0 overrides anhsbot_count (auto-adds when short, auto-kicks when over). ANHS hard-caps
// at 16 players, i.e. up to ~15 bots + 1 human.
anhsbot_quota "5"

// 允许加入僵尸队的配额 bot 数 / How many quota bots may join the zombie team.
// 引擎限制：僵尸玩家队同时只允许 1 名，且换队会被引擎重置回人类队，故默认 0
// （只出幸存者打 NPC）。1=实验开关（进队即自杀、30s 退避重试）。
// Engine limit: only 1 zombie player at a time and team changes are reset by
// the engine, so default 0 (survivor bots vs NPCs only). 1 = experimental.
anhsbot_quota_joinzombie "0"

// ---- 团队 / Teamplay ----

// 团队模式 / Teamplay mode: 幸存者 team 2/3 互为队友——不互杀、开火前友伤遮挡检查、
// 空闲时向队友集结（<1600u）。0=各自为战（会互杀）。
// 1 = survivor teams 2/3 treat each other as teammates (no infighting, no
// friendly fire, regroup when idle). 0 = free-for-all.
anhsbot_teamplay "1"

// ---- 导航 / Navigation ----

// nav 寻路总开关 / A* nav mesh pathfinding switch.
// 1=地图有 .nav 文件时启用自研 A* 寻路（目标 >700u 或无 LOS 时逼近；空闲时
// 集结/随机漫游）；无 .nav 的图自动回退纯几何走位（距离带 + 墙滑 + 兜底游走）。
// 1 = enable A* pathfinding on maps that have a .nav file; maps without one
// fall back to pure geometric movement (distance bands + wall slide + scout).
anhsbot_nav "1"

// ---- 稳定性 / Stability ----

// 禁用 logic_achievement 实体 / Disable logic_achievement entities on map start.
// 规避 fake client 踩 trigger_hurt 死亡 → 熊夹成就 → server.dll 空指针崩溃
// （实测复现 2 次）。不需要 sv_cheats。
// Works around a fake-client achievement null-pointer crash (bear trap death
// -> MOD_BEAR_TRAP achievement). Does not need sv_cheats.
anhsbot_no_achievements "1"
